@if (isOpen()) {
  <div class="fixed inset-0 bg-black/32 z-50 flex justify-end" (click)="close.emit()">
    <div
      class="bg-white w-full max-w-[480px] h-full shadow-2xl flex flex-col"
      (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between p-4 border-b">
        <div>
          <h3 class="mat-title-medium m-0">{{ title() }}</h3>
          @if (subtitle()) {
            <p class="mat-body-small text-slate-500 m-0">{{ subtitle() }}</p>
          }
        </div>
        <app-button variant="icon" icon="close" (clicked)="close.emit()"></app-button>
      </div>

      <div class="flex-1 overflow-y-auto p-4">
        <ng-content></ng-content>
      </div>

      <div class="p-4 border-t flex justify-end gap-2">
        <ng-content select="[drawer-actions]"></ng-content>
      </div>
    </div>
  </div>
}
