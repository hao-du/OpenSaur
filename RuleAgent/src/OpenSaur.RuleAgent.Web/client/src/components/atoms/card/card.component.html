<mat-card [appearance]="appearance()">
  @if (title()) {
    <mat-card-header>
      <mat-card-title>{{ title() }}</mat-card-title>
      <ng-content select="[card-actions]"></ng-content>
    </mat-card-header>
  }
  <mat-card-content>
    <ng-content></ng-content>
  </mat-card-content>
</mat-card>
