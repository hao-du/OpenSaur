<div class="min-h-screen flex flex-col bg-slate-50 text-slate-800">
  <!-- Top App Header -->
  <app-header (toggleMenu)="toggleMobileMenu()"></app-header>

  <div class="flex-1 flex overflow-hidden">
    <!-- Desktop Collapsible Sidebar -->
    <aside
      class="hidden md:block bg-white border-r transition-all duration-200"
      [class.w-64]="!sidebarCollapsed()"
      [class.w-16]="sidebarCollapsed()">
      <app-side-menu [collapsed]="sidebarCollapsed()"></app-side-menu>
    </aside>

    <!-- Main Content Area with Router Outlet -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-[#edf3f8]">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile Navigation Drawer -->
  <app-drawer
    [isOpen]="mobileMenuOpen()"
    title="Navigation"
    (close)="mobileMenuOpen.set(false)">
    <app-side-menu (click)="mobileMenuOpen.set(false)"></app-side-menu>
  </app-drawer>
</div>
