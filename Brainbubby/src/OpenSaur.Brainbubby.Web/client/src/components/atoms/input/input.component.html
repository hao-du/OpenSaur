<div class="flex flex-col gap-1.5 w-full">
  @if (label()) {
    <app-label variant="form" [required]="required()" [text]="label()"></app-label>
  }

  <div
    class="flex items-center w-full bg-white border border-stone-200 rounded-lg px-3 py-2 text-stone-800 transition-colors focus-within:border-[#ec6530] focus-within:ring-1 focus-within:ring-[#ec6530]"
    [class.opacity-60]="disabled() || isDisabled"
    [class.cursor-not-allowed]="disabled() || isDisabled"
    [class.!border-red-500]="errorMessage()">
    @if (prefixIcon()) {
      <span class="mr-2 text-stone-400 flex items-center shrink-0">
        <app-icon [name]="prefixIcon()!" [size]="18"></app-icon>
      </span>
    }

    <input
      class="w-full bg-transparent border-0 p-0 text-sm focus:outline-none placeholder:text-stone-400 text-stone-800 disabled:cursor-not-allowed"
      [type]="type()"
      [placeholder]="placeholder()"
      [disabled]="disabled() || isDisabled"
      [value]="value()"
      (input)="onInputChange($event)"
      (blur)="onBlur()" />
  </div>

  @if (errorMessage()) {
    <span class="text-xs text-red-500 font-medium">{{ errorMessage() }}</span>
  }
</div>
