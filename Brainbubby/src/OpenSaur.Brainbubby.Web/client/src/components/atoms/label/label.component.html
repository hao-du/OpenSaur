<label
  [attr.for]="forId()"
  [class]="'app-label app-label--' + variant()"
  [class.app-label--bold]="bold()">
  <span class="app-label__content">
    @if (text()) {
      {{ text() }}
    }
    <ng-content></ng-content>
  </span>
  @if (required()) {
    <span class="app-label__required" aria-hidden="true">*</span>
  }
  @if (hint()) {
    <span class="app-label__hint">{{ hint() }}</span>
  }
</label>
