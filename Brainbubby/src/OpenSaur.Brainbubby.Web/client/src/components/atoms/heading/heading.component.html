@switch (+level()) {
  @case (1) {
    <h1 class="heading-1"><ng-content></ng-content></h1>
  }
  @case (2) {
    <h2 class="heading-2"><ng-content></ng-content></h2>
  }
  @case (3) {
    <h3 class="heading-3"><ng-content></ng-content></h3>
  }
  @default {
    <h4 class="heading-4"><ng-content></ng-content></h4>
  }
}
