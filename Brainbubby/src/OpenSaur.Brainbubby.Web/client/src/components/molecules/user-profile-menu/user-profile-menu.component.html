<div class="flex items-center justify-center">
  <button
    matRipple
    [matMenuTriggerFor]="userMenu"
    aria-label="User profile"
    class="profile-trigger-btn flex items-center justify-center cursor-pointer p-0 border-0 bg-transparent rounded-full focus:outline-none">
    <app-avatar [name]="userName()" [size]="36"></app-avatar>
  </button>

  <mat-menu #userMenu="matMenu" class="user-profile-menu-panel" xPosition="before">
    <div class="user-menu-header">
      <div class="font-semibold text-stone-900 leading-snug truncate">{{ userName() }}</div>
      <div class="text-xs text-stone-500 truncate mt-0.5">{{ userEmail() }}</div>
    </div>
    <div class="user-menu-divider"></div>
    <div class="user-menu-items">
      <button mat-menu-item routerLink="/settings" class="user-menu-item">
        <app-icon name="settings" [size]="18" class="item-icon"></app-icon>
        <span class="item-text">Settings</span>
      </button>
      <button mat-menu-item (click)="logout.emit()" class="user-menu-item">
        <app-icon name="log-out" [size]="18" class="item-icon"></app-icon>
        <span class="item-text">Sign out</span>
      </button>
    </div>
  </mat-menu>
</div>
