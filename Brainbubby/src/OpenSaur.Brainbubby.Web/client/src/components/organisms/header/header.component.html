<header class="h-16 app-header border-b border-stone-200/80 flex items-center justify-between sticky top-0 z-40">
  <div class="flex items-center h-full">
    <!-- Mobile hamburger button -->
    <div class="md:hidden ml-4 mr-2">
      <app-button variant="icon" icon="menu" (clicked)="toggleMenu.emit()"></app-button>
    </div>

    <!-- Brainbubby Logo brand box matching sidebar width (w-64) with same border-r and white background -->
    <div class="hidden md:flex items-center gap-2.5 cursor-pointer select-none w-64 h-full px-4 bg-white border-r border-stone-200/80">
      <img src="logo.svg" alt="Brainbubby Logo" class="w-8 h-8 object-contain" />
      <span class="font-bold text-base uppercase tracking-widest text-stone-900">BRAINBUBBY</span>
    </div>

    <!-- Mobile Brainbubby Logo -->
    <div class="flex md:hidden items-center gap-2 cursor-pointer select-none mr-3">
      <img src="logo.svg" alt="Brainbubby Logo" class="w-7 h-7 object-contain" />
      <span class="font-bold text-sm uppercase tracking-widest text-stone-900">BRAINBUBBY</span>
    </div>
  </div>

  <!-- User Profile Menu Molecule -->
  <div class="px-4 flex items-center h-full">
    <app-user-profile-menu
      [userName]="userName()"
      [userEmail]="userEmail()"
      (logout)="logout.emit()">
    </app-user-profile-menu>
  </div>
</header>
