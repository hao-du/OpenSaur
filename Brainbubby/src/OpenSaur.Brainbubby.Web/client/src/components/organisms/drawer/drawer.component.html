@if (isOpen()) {
  <div
    class="fixed top-0 right-0 w-full h-full shadow-2xl flex flex-col border-l border-stone-200 bg-white z-50 transition-all"
    [class.max-w-[480px]]="size() === 'narrow'"
    [class.max-w-[760px]]="size() === 'wide'"
    [class.max-w-full]="size() === 'full'">
      <!-- Drawer Header matching CashPilot DrawerHeader -->
      <div class="h-16 px-6 border-b border-stone-200 flex items-center justify-between shrink-0 bg-white">
        <div class="flex flex-col justify-center min-w-0 pr-3">
          <app-heading-2 class="truncate">{{ title() }}</app-heading-2>
          @if (subtitle()) {
            <app-text-caption class="truncate mt-0.5 block">{{ subtitle() }}</app-text-caption>
          }
        </div>
        <app-button variant="icon" icon="x" (clicked)="close.emit()"></app-button>
      </div>

      <!-- Drawer Body matching CashPilot DrawerBody -->
      <div class="flex-1 overflow-y-auto p-6 bg-white">
        <ng-content></ng-content>
      </div>

      <!-- Drawer Footer matching CashPilot DrawerFooter -->
      <div class="px-6 py-4 border-t border-stone-200 bg-stone-50 flex items-center justify-end gap-3 shrink-0">
        <ng-content select="[drawer-actions]"></ng-content>
      </div>
  </div>
}
