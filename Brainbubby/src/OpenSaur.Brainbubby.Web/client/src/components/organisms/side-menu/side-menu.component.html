<nav class="flex flex-col gap-1 p-3">
  @for (item of navItems; track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="!bg-[#fff2ec] !text-[#ec6530] font-semibold shadow-xs"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-stone-600 hover:bg-[#fff7f3] hover:text-[#ec6530] transition-colors text-sm select-none">
      <app-icon [name]="item.icon" [size]="20"></app-icon>
      @if (!collapsed()) {
        <app-text variant="body" class="truncate">{{ item.label }}</app-text>
      }
    </a>
  }
</nav>
