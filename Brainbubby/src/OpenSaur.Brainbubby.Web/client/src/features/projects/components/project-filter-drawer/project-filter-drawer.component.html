<app-drawer
  [isOpen]="isOpen()"
  title="Filter Projects"
  subtitle="Search and refine projects list"
  (close)="close.emit()">
  <div class="flex flex-col gap-4">
    <app-input
      label="Search"
      placeholder="Search by project name or description..."
      prefixIcon="search"
      [value]="searchQuery()"
      (valueChange)="searchQueryChange.emit($event)">
    </app-input>

    <div class="text-xs text-stone-500 font-medium">
      Showing {{ filteredCount() }} of {{ totalCount() }} projects
    </div>
  </div>

  <div drawer-actions class="flex items-center gap-2">
    <app-button
      variant="secondary"
      (clicked)="clear.emit()">
      Clear
    </app-button>
    <app-button
      variant="primary"
      (clicked)="close.emit()">
      Done
    </app-button>
  </div>
</app-drawer>
