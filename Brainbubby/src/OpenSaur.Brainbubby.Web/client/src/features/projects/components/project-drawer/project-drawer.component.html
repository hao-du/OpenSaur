<app-drawer
  [isOpen]="isOpen()"
  [title]="isEditing() ? 'Edit Project' : 'New Project'"
  [subtitle]="isEditing() ? 'Update project configuration' : 'Create an isolated workspace for rules and files'"
  (close)="close.emit()">
  
  <div class="flex flex-col gap-5">
    <app-input
      label="Project Name"
      placeholder="e.g. Core Banking Rules"
      [required]="true"
      [value]="name()"
      (valueChange)="name.set($event)">
    </app-input>

    <div class="flex flex-col gap-1.5">
      <app-label variant="form" hint="(optional)">Description</app-label>
      <textarea
        [value]="description()"
        (input)="onDescriptionInput($event)"
        rows="3"
        placeholder="Brief description of rules, prompts, or agents managed here"
        class="w-full px-3 py-2 text-sm bg-white border border-stone-200 rounded-lg focus:outline-none focus:border-[#ec6530] focus:ring-1 focus:ring-[#ec6530] text-stone-800 placeholder:text-stone-400 resize-none transition-colors">
      </textarea>
    </div>

    <div class="flex flex-col gap-1.5">
      <app-label variant="form" hint="(optional)">Default Instruction Template</app-label>
      <select
        [value]="selectedTemplateId()"
        (change)="onTemplateSelect($event)"
        class="w-full px-3 py-2 text-sm bg-white border border-stone-200 rounded-lg focus:outline-none focus:border-[#ec6530] focus:ring-1 focus:ring-[#ec6530] text-stone-800 transition-colors">
        <option value="">None (start blank)</option>
        @for (tpl of templates(); track tpl.id) {
          <option [value]="tpl.id">{{ tpl.name }}</option>
        }
      </select>
      <p class="text-xs text-stone-500 m-0">Pre-populates new rule files with workspace guidelines.</p>
    </div>

    @if (errorMessage()) {
      <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-600 font-medium">
        {{ errorMessage() }}
      </div>
    }
  </div>

  <div drawer-actions class="flex items-center gap-2">
    <app-button
      variant="secondary"
      (clicked)="close.emit()">
      Cancel
    </app-button>
    <app-button
      variant="primary"
      [disabled]="!name().trim() || saving()"
      [loading]="saving()"
      (clicked)="save()">
      {{ isEditing() ? 'Update Project' : 'Create Project' }}
    </app-button>
  </div>
</app-drawer>
