<app-drawer
  [isOpen]="isOpen()"
  size="wide"
  [title]="isEditing() ? (isSuperAdmin() ? 'Edit Instruction Template' : 'Template Details') : 'New Instruction Template'"
  [subtitle]="isEditing() ? 'Update guideline details and boilerplate content' : 'Create workspace boilerplate rules and instructions'"
  (close)="close.emit()">

  <div class="flex flex-col gap-4">
    <app-input
      label="Template Name"
      placeholder="e.g. AGENTS.md / Core Coding Rules"
      [required]="true"
      [value]="name()"
      (valueChange)="name.set($event)">
    </app-input>

    <div class="flex flex-col gap-1.5">
      <app-label variant="form" hint="(optional)">Description</app-label>
      <textarea
        [value]="description()"
        (input)="onDescriptionInput($event)"
        rows="2"
        placeholder="Brief summary of when and how to use this template"
        class="w-full px-3 py-2 text-sm bg-white border border-stone-200 rounded-lg focus:outline-none focus:border-[#ec6530] focus:ring-1 focus:ring-[#ec6530] text-stone-800 placeholder:text-stone-400 resize-none transition-colors">
      </textarea>
    </div>

    <!-- Content with Markdown Editor & Preview -->
    <div class="flex flex-col gap-1.5">
      <app-label variant="form" [hint]="'(' + content().length + ' chars)'">Instruction Content</app-label>

      <app-markdown-editor [(value)]="content"></app-markdown-editor>

      <p class="text-xs text-stone-400 m-0">This boilerplate will pre-populate rule files when projects adopt this template.</p>
    </div>

    @if (errorMessage()) {
      <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-600 font-medium">
        {{ errorMessage() }}
      </div>
    }
  </div>

  <div drawer-actions class="flex items-center gap-2">
    <app-button
      variant="secondary"
      (clicked)="close.emit()">
      Cancel
    </app-button>
    <app-button
      variant="primary"
      [disabled]="!name().trim() || saving()"
      [loading]="saving()"
      (clicked)="save()">
      {{ isEditing() ? 'Update Template' : 'Create Template' }}
    </app-button>
  </div>
</app-drawer>
